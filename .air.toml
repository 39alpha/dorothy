root = "."
tmp_dir = "working/tmp"

[build]
  args_bin = ["test"]
  bin = "/usr/bin/make"
  cmd = "/usr/bin/make"
  delay = 1000
  exclude_dir = [
    "test/bats",
    "test/test_helper/bats-assert",
    "test/test_helper/bats-support",
  ]
  exclude_file = []
  exclude_regex = []
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "core", "dataforge", "sdk", "test"]
  include_ext = ["go", "css", "html", "js", "bats"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 4248
  enabled = true
  proxy_port = 5000

[screen]
  clear_on_rebuild = true
  keep_scroll = false
