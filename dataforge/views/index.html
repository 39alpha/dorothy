<header>
    <h2 class="mb-0">
        {{ if .AuthUser }}
        Your Recent Datasets
        {{ else }}
        Recent Public Datasets
        {{ end }}
    </h2>
    <nav>
        <ul class="mt-0">
            {{ if .Datasets }}
            <li><a href="#">More Datasets</a></li>
            {{ end }}
        </ul>
    </nav>
</header>
{{ with .Datasets }}
{{ template "partials/asset-entry" . }}
{{ else }}
<p>No datasets have been created yet.</p>
{{ end }}
