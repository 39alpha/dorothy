<section>
    <h1>Create a dataset for {{ .Team.Name }}</h1>

    <form class="flex flex-col max-w-sm" method="POST">
        {{ template "partials/error-message" . }}

        <input class="hidden" name="teamId" type="number" value="{{ .Team.ID }}" readonly />

        <label class="font-bold" for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Dataset Name" autofocus required />
        <p class="mt-0 mb-2 hidden"><small id="availability"></small></p>

        <label class="font-bold" for="contact">Contact Email</label>
        <input name="contact" type="email" value="{{ .AuthUser.Email }}" required />

        <label class="font-bold" for="description">Description</label>
        <textarea name="description" rows="4" placeholder="Dataset Description"></textarea>

        <div class="inline">
            <label class="font-bold" for="isPrivate">Private?</label>
            <input name="isPrivate" type="checkbox" value="true" />
        </div>

        <button type="submit">Create Dataset ▶</button>
    </form>
</section>

<script>
    checkAvailability("dataset", "/{{ .Team.Name }}/dataset/availability", {
        startDisabled: true,
        trigger: 'button[type="submit"]',
        target_parent: true,
    });
</script>
