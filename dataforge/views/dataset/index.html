<section>
  <header>
    <h1><a href="/{{ .Dataset.Team.Name }}">{{ .Dataset.Team.Name }}</a>/{{ .Dataset.Name }}</h1>
    <nav>
      <ul>
        {{ if .CanManage }}
        <li>
          <a href="/{{ .Dataset.Team.Name }}/{{ .Dataset.Name }}/settings"><i class="fa-solid fa-gear"></i></a>
        </li>
        {{ end }}
      </ul>
    </nav>
  </header>
  <div class="manifest">
    {{ if .Dataset.Manifest.Versions }}
    <ul class="versions">
      {{ range .Dataset.Manifest.ReverseVersions }}
      {{ template "partials/version" . }}
      {{ end }}
    </ul>
    {{ else }}
    <p>No versions have been uploaded quite yet!</p>
    {{ end }}
  </div>
</section>
