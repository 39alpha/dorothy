<h2>Something wicked this way comes...</h2>

<p>An unexpected error occured. You should probably complain about it.</p>
{{ with .Error }}
    <p class="ml-10">
        <code>{{ . }}</code>
    </p>
{{ end }}

{{ with .RequestID }}
    <p>If you decide to report this to your administrator, include the following ID:</p>
    <p class="ml-10">
        <code>{{ . }}</code>
    </p>
{{ end }}
