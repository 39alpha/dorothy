<header>
    <h1 class="mt-3 mb-0"><a href="/">{{ .Title }}</a></h1>
    <p class="my-0">{{ .SubTitle }}</p>
    <nav>
        <ul>
            {{ if .AuthUser }}
            <li><a href="/profile">{{.AuthUser.Name}}</a></li>
            <li><a href="/logout">Logout</a></li>
            {{ else }}
            <li><a href="/login?Redirect={{ .Path }}">Login</a></li>
            {{ if .AllowRegistration }}
            <li><a href="/register">Register</a></li>
            {{ end }}
            {{ end }}
        </ul>
    </nav>
</header>
