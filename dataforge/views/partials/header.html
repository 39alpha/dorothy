<header role="banner">
  <nav>
    <div>
      <h1><a href="/">Dorothy</a></h1>
      <p>Welcome to the dataforge.</p>
    </div>
    <ul>
      {{ if .AuthUser }}
      <li>
        <b>{{.AuthUser.Name}}</b>
      </li>
      <li><a href="/logout">Logout</a></li>
      {{ else }}
      <li><a href="/login?Redirect={{ .Path }}">Login</a></li>
      <li><a href="/register">Register</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
