<li data-hash="{{ .Hash }}" data-parents="{{ .Parents }}">
    {{if eq .PathType "DIRECTORY"}}<i class="fa-solid fa-folder"></i>{{else}}<i class="fa-solid fa-file"></i>{{end}}
    <a class="select-none" href="{{ .Hash | GatewayUrl }}">{{ .Message }}</a>
    <ul class="list-none">
        <li><small>Committed on <time datetime="{{.Date}}">{{TimeFmt .Date}}</time></small></li>
        <li><small>{{ .Author }}</small></li>
        <li><small>{{ .Hash }}</small></li>
    </ul>
</li>
