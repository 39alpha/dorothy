<dl>
{{ range . }}
    <dt>
        <a href="{{ .Path }}">{{ .FullName }}</a>
        {{ if .IsPrivate }}
        <i class="fa-solid fa-lock-open"></i>
        {{ end }}
    </dt>
    {{ with .Description }}
    <dd class="ml-4">
        {{ . }}
    {{ else }}
    <dd class="ml-4 italic">
        No description...
    {{ end }}
    </dd>
{{ end }}
</dl>
