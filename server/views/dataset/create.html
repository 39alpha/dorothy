<section>
  <header>
    <h1>Create a Dataset for {{ .Team.Name }}</h1>
  </header>

  <form method="POST">
    {{ with .Error }}
    <div class="message">
      <p class="error">
        {{ . }}
      </p>
    </div>
    {{ end }}

    <input class="hidden" name="teamId" type="number" value="{{ .Team.ID }}" readonly />

    <div>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Dataset Name" />
      <p id="availability" class="hidden"></p>
    </div>

    <div>
      <label for="contact">Contact Email</label>
      <input name="contact" type="email" value="{{ .AuthUser.Email }}" />
    </div>

    <div>
      <label for="description">Description</label>
      <textarea name="description" rows="4" placeholder="Dataset Description"></textarea>
    </div>

    <div class="inline">
      <label for="isPrivate">Private?</label>
      <input name="isPrivate" type="checkbox" value="true" />
    </div>

    <div>
      <button type="submit">Create Dataset ▶</button>
    </div>
  </form>
</section>

<script>
  checkAvailability("dataset", "/{{.Team.Name}}/dataset/availability", {
    startDisabled: true,
    trigger: 'button[type="submit"]'
  });
</script>
