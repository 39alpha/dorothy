<section>
  <header>
    <h1>Edit Dataset {{ .Team.Slug }}/{{ .Dataset.Slug }}</h1>
  </header>

  <div class="modal model-hidden">
    <h1 class="modal_title"></h1>
    <p class="model_message"></p>
  </div>

  <form name="update" method="POST" onsubmit="return confirm()">
    {{ with .Error }}
    <div class="message">
      <p class="error">
        {{ . }}
      </p>
    </div>
    {{ end }}

    <input class="hidden" name="teamId" type="number" value="{{ .Team.ID }}" readonly />

    <input class="hidden" name="id" type="number" value="{{ .Dataset.ID }}" readonly />

    <div class="automatic">
      <label for="slug">Slug</label>
      <input class="disabled" id="slug" name="slug" value="{{ .Dataset.Slug }}" type=" text" readonly />
    </div>

    <div>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" value="{{ .Dataset.Name }}" />
    </div>

    <div>
      <label for="contact">Contact Email</label>
      <input name="contact" type="email" value="{{ .Dataset.Contact }}" />
    </div>

    <div>
      <label for="description">Description</label>
      <textarea name="description" rows="4">
        {{- .Dataset.Description -}}
      </textarea>
    </div>

    <div class="inline">
      <label for="isPrivate">Private?</label>
      <input name="isPrivate" type="checkbox" data-value="{{ .Dataset.IsPrivate }}" {{ if .Dataset.IsPrivate }}checked{{
        end }} />
    </div>

    <div>
      <button type=" submit">Update Dataset ▶</button>
    </div>
  </form>

  {{ template "views/partials/slugify" . }}

  <script>
    const confirm = function () {
      const is_private = $("form[name='update']").find("input[name='isPrivate']");
      const was = is_private.attr('data-value') == "true" ? true : false;
      const now = is_private.prop('checked');
      if (was !== now) {

      }
      return false;
    }
  </script>
</section>
