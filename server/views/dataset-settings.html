<section>
  <header>
    <h1>{{ .Team.Slug }}/{{ .Dataset.Slug }} Settings</h1>
  </header>

  <form name="update" method="POST" onsubmit="return intentional();">
    {{ with .Error }}
    <div class="message">
      <p class="error">
        {{ . }}
      </p>
    </div>
    {{ end }}

    <input class="hidden" name="teamId" type="number" value="{{ .Team.ID }}" readonly />

    <input class="hidden" name="id" type="number" value="{{ .Dataset.ID }}" readonly />

    <div class="automatic">
      <label for="slug">Slug</label>
      <input class="disabled" id="slug" name="slug" data-value="{{ .Dataset.Slug }}" value="{{ .Dataset.Slug }}"
        type=" text" readonly />
    </div>

    <div>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" data-value="{{ .Dataset.Name }}" value="{{ .Dataset.Name }}" />
    </div>

    <div>
      <label for="contact">Contact Email</label>
      <input name="contact" type="email" value="{{ .Dataset.Contact }}" />
    </div>

    <div>
      <label for="description">Description</label>
      <textarea name="description" rows="4">
        {{- .Dataset.Description -}}
      </textarea>
    </div>

    <div class="inline">
      <label for="isPrivate">Private?</label>
      <input name="isPrivate" type="checkbox" data-value="{{ .Dataset.IsPrivate }}" {{ if .Dataset.IsPrivate }}checked{{
        end }} />
    </div>

    <div class="inline">
      <label for="delete">Delete the Dataset?</label>
      <input name="delete" type="checkbox" />
    </div>

    <div>
      <button type="submit">Update Dataset ▶</button>
    </div>
  </form>

  {{ template "views/partials/slugify" . }}

  <script>
    const confirm_slug_change = (form) => {
      const dataset_slug = form.find("input[name='slug']");
      const was = dataset_slug.attr('data-value');
      const now = dataset_slug.prop('value');

      const msg = `You are about to change the dataset slug from ${was} to ${now}.\n\n` +
        `Users who have cloned the repository will have to change their remote setting.\n\n` +
        `Are you sure you want to do this?`;
      if (was !== now && !confirm(msg)) {
        return false;
      }

      return true;
    };

    const confirm_visibility_change = (form) => {
      const is_private = form.find("input[name='isPrivate']");
      const was = is_private.attr('data-value') == 'true' ? 'private' : 'public';
      const now = is_private.prop('checked') ? 'private' : 'public';

      let msg = `You are about to change the visibility of the dataset from ${was} to ${now}.\n\n`;
      if (now == 'public') {
        msg += `Anyone will be able to view the dataset, but only users with admin or write access will be able to modify it.\n\n`;
      } else {
        msg += `Only users with read, write or admin access to the respository will be able to view the dataset.\n\n`;
      }
      msg += `Are you sure you want to do this?`;

      if (was !== now && !confirm(msg)) {
        return false;
      }

      return true;
    };

    const confirm_deletion = (form) => {
      const delete_dataset = form.find("input[name='delete']").prop('checked');

      let msg = `You are about to DELETE the dataset!.\n\n` +
        `This cannot be undone.\n\n` +
        `Are you sure you want to delete the dataset?`;

      if (delete_dataset && !confirm(msg)) {
        return false;
      }

      return true;
    };

    const intentional = () => {
      const form = $("form[name='update']");

      const delete_dataset = form.find("input[name='delete']").prop('checked');
      if (delete_dataset) {
        return confirm_deletion(form);
      }

      if (!confirm_slug_change(form)) {
        return false;
      }

      if (!confirm_visibility_change(form)) {
        return false;
      }

      return true;
    };
  </script>
</section>
