<section>
  <header>
    <h1><a href="/{{ .Team.Slug }}">{{ .Team.Name }}</a>/{{ .Dataset.Name }}</h1>
    <nav>
      <ul>
        <li>
          <a href="/{{ .Team.Slug }}/{{ .Dataset.Slug }}/settings"><i class="fa-solid fa-gear"></i></a>
        </li>
      </ul>
    </nav>
  </header>
  <div class="manifest">
    {{ if .Dataset.Manifest.Versions }}
    <ul class="versions">
      {{ range .Dataset.Manifest.ReverseVersions }}
      {{ template "views/partials/version" . }}
      {{ end }}
    </ul>
    {{ else }}
    <p>No versions have been uploaded quite yet!</p>
    {{ end }}
  </div>
</section>
